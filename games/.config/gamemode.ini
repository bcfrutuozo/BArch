; gamemode do BArch: o modo desempenho só liga com um jogo aberto.
; O run.sh carrega o gamemode para tudo que roda no prefixo, então o launcher do
; Battle.net e os processos do próprio Wine ficam de fora. O gamemode compara pedaços
; do caminho real do .exe (diferencia maiúsculas): "/Battle.net/" pega o launcher e o
; Agent (prefix/drive_c/.../Battle.net/), mas não os jogos (~/Games/battle.net/games).
[general]
renice=10
softrealtime=auto
inhibit_screensaver=1

[filter]
blacklist=/Battle.net/
blacklist=/windows/system32/
blacklist=/windows/syswow64/
blacklist=wineserver

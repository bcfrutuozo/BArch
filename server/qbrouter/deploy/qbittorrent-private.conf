[AutoRun]
enabled=false
program=

[BitTorrent]
Session\DefaultSavePath=/data/completed
Session\TempPath=/data/incomplete/private
Session\TempPathEnabled=true
Session\Port=6882
Session\DHTEnabled=false
Session\PeXEnabled=false
Session\LSDEnabled=false
Session\Encryption=0
Session\AnonymousModeEnabled=false
Session\QueueingSystemEnabled=false
Session\AddTrackersEnabled=false

[Core]
AutoDeleteAddedTorrentFile=Never

[LegalNotice]
Accepted=true

[Network]
PortForwardingEnabled=false

[Preferences]
Connection\UPnP=false
Downloads\ScanDirsV2=@Variant(\0\0\0\x1c\0\0\0\0)
WebUI\Address=*
WebUI\ServerDomains=*
WebUI\Username=@USERNAME@
WebUI\Password_PBKDF2="@ByteArray(@PBKDF2@)"
WebUI\LocalHostAuth=true
WebUI\AuthSubnetWhitelistEnabled=true
WebUI\AuthSubnetWhitelist=100.100.0.0/24, 100.100.1.0/24, 172.18.0.0/16
WebUI\ReverseProxySupportEnabled=true
WebUI\TrustedReverseProxiesList=172.18.0.0/16
WebUI\HostHeaderValidation=false
WebUI\CSRFProtection=true

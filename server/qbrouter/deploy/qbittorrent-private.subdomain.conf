## BArch qbrouter (server/qbrouter): the web UI of qbittorrent-private (no VPN) through SWAG.
## install.sh stages it with the real domain (taken from qbittorrent.subdomain.conf) in the temporary share;
## the repo keeps example.com. The page needs Authelia from anywhere; the API is open only to the LAN, the
## other site and the Docker networks (anything else needs an Authelia session too), like qbittorrent's.
## qBittorrent trusts SWAG as a reverse proxy, so its whitelist sees the real client address, not SWAG's.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name downloader-private.example.com;

    include /config/nginx/ssl.conf;
    include /config/nginx/authelia-server.conf;

    location / {
        include /config/nginx/authelia-location.conf;
        include /config/nginx/proxy.conf;

        set $upstream_app qbittorrent-private;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    location ~ ^/api {
        satisfy any;
        allow 100.100.0.0/24;
        allow 100.100.1.0/24;
        allow 172.16.0.0/12;
        deny all;
        include /config/nginx/authelia-location.conf;
        include /config/nginx/proxy.conf;

        set $upstream_app qbittorrent-private;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}

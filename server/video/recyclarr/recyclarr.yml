# yaml-language-server: $schema=https://schemas.recyclarr.dev/latest/config-schema.json
#
# BArch video rules, synced into Radarr and Sonarr by Recyclarr (container on the NAS, daily).
# What it enforces (README of server/video):
#   - 2160p only, HEVC only: a release that names AVC/x264, AV1, VC-1, MPEG-2 or VP9 scores -10000
#   - HDR wanted, SDR and DV without an HDR10 fallback refused, the guide's unwanted formats refused
#     (-10000 against a minimum of 0: the guide's formats add up to ~7400 at most, so they stay refused)
#   - PT-BR audio preferred, not required: "BArch: PT-BR audio" +2000 (no more, or a -10000 release
#     with it and the best audio could reach 0). The video pipeline (barch_video) adds the dub to any
#     file that lacks it; a release that already has it just saves that step
#   - only the original language and PT-BR: "BArch: foreign audio" (a language other than the original
#     and no PT-BR: German DL, MULTi, a Russian dub...) -10000 (-20000 in 1080p). Family Guy's seasons
#     3-8 came as German DL x265 (German default, German subtitles) because nothing scored them; Dark's
#     German releases still pass, German is its original
#   - Blu-ray and WEB 2160p are one quality step, so the score decides; 250 MB/min at most (no remuxes)
#   - upgrades on, so a file below the bar is replaced when something better shows up
#
# BArch 1080p, for what never came out in 4K (The Walking Dead): Blu-ray and WEB 1080p as one step,
# HEVC preferred but AVC accepted ("BArch: not HEVC" -2500 against a minimum of -2500: more than a tier bonus, so an x264 encode
# is taken only when it is the best there is, and upgraded to an x265 one later), PT-BR +2000 as in 4K,
# the same unwanted formats refused, HDR not asked for; 10 to 120 MB/min (a good x265 season is ~40,
# below the apps' default minimum of ~50; no 1080p remuxes).
# Pick it by hand per movie or series; 4K stays the default.
#
# Left out on purpose: the guide's "Bad Dual Groups" (alfaHD, GUEIRA, SiGLA, C76, XiQUEXiQUE...) are
# exactly the Brazilian dual-audio groups.
# The profiles are user-defined (no guide trash_id) so the guide's "Original" language rule never comes
# back; Radarr's profile language is set to Any by hand (a release parsed as "Dublado" only is fine).

radarr:
  movies:
    base_url: !secret radarr_url
    api_key: !secret radarr_key
    delete_old_custom_formats: true

    # 250 MB per minute at most (~30 GB for 2 h, ~37 GB for 2 h 30): good encodes and WEB-DLs fit,
    # full remuxes (50-80 GB) do not
    quality_definition:
      type: movie
      qualities:
        - {name: Bluray-2160p, max: 250, preferred: 240}
        - {name: WEBDL-2160p, max: 250, preferred: 240}
        - {name: WEBRip-2160p, max: 250, preferred: 240}
        - {name: Bluray-1080p, min: 10, max: 120, preferred: 110}
        - {name: WEBDL-1080p, min: 10, max: 120, preferred: 110}
        - {name: WEBRip-1080p, min: 10, max: 120, preferred: 110}

    quality_profiles:
      - name: BArch 4K
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: 2160p
          until_score: 20000
        min_format_score: 0
        quality_sort: top
        qualities:
          # one step: Blu-ray and WEB are equal, the custom format score decides between them
          - name: 2160p
            qualities: [Bluray-2160p, WEBDL-2160p, WEBRip-2160p]

      - name: BArch 1080p
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: 1080p
          until_score: 20000
        min_format_score: -2500
        quality_sort: top
        qualities:
          - name: 1080p
            qualities: [Bluray-1080p, WEBDL-1080p, WEBRip-1080p]

    custom_formats:
      - trash_ids: [eb41082b76e883d189d5980f7dc5ed01] # BArch: PT-BR audio
        assign_scores_to:
          - name: BArch 4K
            score: 2000
          - name: BArch 1080p
            score: 2000
      - trash_ids: [54efba8afc1aa3765c7317a6ab1d2d04] # BArch: foreign audio (a language beyond the original, without PT-BR)
        assign_scores_to:
          - name: BArch 4K
          - name: BArch 1080p
            score: -20000
      - trash_ids: [d295ca6f4c437dd552f31851e6613600] # BArch: not HEVC
        assign_scores_to:
          - name: BArch 4K
          - name: BArch 1080p
            score: -2500
      - trash_ids:
          - e7718d7a3ce595f289bfee26adc178f5 # Repack/Proper
          - ae43b294509409a6a13919dedd4764c4 # Repack2
          - 5caaaa1c08c1742aa4342d8c4cc463f2 # Repack3
          - c20f169ef63c5f40c2def54abaf4438e # WEB Tier 01
          - 403816d65392c79236dcb6dd591aeda4 # WEB Tier 02
          - af94e0fe497124d1f9ce732069ec8c3b # WEB Tier 03
        assign_scores_to:
          - name: BArch 4K
          - name: BArch 1080p
      - trash_ids:
          - ed27ebfef2f323e964fb1f61391bcb35 # HD Bluray Tier 01
          - c20c8647f2746a1f4c4262b0fbbeeeae # HD Bluray Tier 02
          - 5608c71bcebba0a5e666223bae8c9227 # HD Bluray Tier 03
        assign_scores_to:
          - name: BArch 1080p
      - trash_ids:
          - 4d74ac4c4db0b64bff6ce0cffef99bf0 # UHD Bluray Tier 01
          - a58f517a70193f8e578056642178419d # UHD Bluray Tier 02
          - e71939fae578037e7aed3ee219bbe7c1 # UHD Bluray Tier 03
        assign_scores_to:
          - name: BArch 4K

      # unwanted, for 1080p at -20000: its minimum is -2500 and the audio formats reach +5000, so the
      # guide's -10000 could come back above it (4K keeps the group's -10000 against a minimum of 0)
      - trash_ids:
          - b8cd450cbfa689c0259a01d9e29ba3d6 # 3D
          - cae4ca30163749b891686f95532519bd # AV1
          - cc444569854e9de0b084ab2b8b1532b2 # Black and White Editions
          - ed38b889b31be83fda192888e2286d83 # BR-DISK
          - 0a3f082873eb454bde444150b70253cc # Extras
          - e6886871085226c3da1830830146846c # Generated Dynamic HDR
          - c465ccc73923871b3eb1802042331306 # Line/Mic Dubbed
          - 90a6f9a284dff5103f6346090e6280c8 # LQ
          - e204b80c87be9497a8a6eaff48f72905 # LQ (Release Title)
          - 712d74cd88bceb883ee32f773656b1f5 # Sing-Along Versions
          - bfd8eb01832d646a0a89c4deb46f8564 # Upscaled
        assign_scores_to:
          - name: BArch 1080p
            score: -20000

    custom_format_groups:
      add:
        - trash_id: a3ac6af01d78e4f21fcb75f601ac96df # Unwanted formats (3D, AV1, BR-DISK, LQ, Upscaled...)
          exclude: [b6832f586342ef70d9c128d40c07b872] # Bad Dual Groups
          assign_scores_to: [{name: BArch 4K}]
        - trash_id: ef20e67b95a381fb3bc6d1f06ea24f46 # HDR
          assign_scores_to: [{name: BArch 4K}]
        - trash_id: b29413a7487478fe98228ce79e5689e4 # HDR10+ boost
          assign_scores_to: [{name: BArch 4K}]
        - trash_id: 7fc2751eef7e6bdc70b74136e5e35c76 # DV (w/o HDR fallback): purple/green outside DV players
          assign_scores_to: [{name: BArch 4K}]
        - trash_id: 47f0d69750de9e16855915fa73bb7b08 # SDR
          select: [9c38ebb7384dada637be8899efa68e6f] # SDR
          assign_scores_to: [{name: BArch 4K}]
        - trash_id: ff204bbcecdd487d1cefcefdbf0c278d # Golden rule UHD: x265 (no HDR/DV)
          assign_scores_to: [{name: BArch 4K}]
        - trash_id: 9d5acd8f1da78dfbae788182f7605200 # Audio formats
          assign_scores_to: [{name: BArch 4K}, {name: BArch 1080p}]
        - trash_id: d9cc9a504e5ede6294c8b973aad4f028 # Streaming services
          assign_scores_to: [{name: BArch 4K}, {name: BArch 1080p}]


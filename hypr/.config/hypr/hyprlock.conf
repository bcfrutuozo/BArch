# hyprlock — cores vêm do tema da barra (Quickshell), no modo claro/escuro do momento.
# O arquivo abaixo é gerado pelo Theme.qml; não edite ele, edite as paletas no Theme.qml.
source = ~/.config/hypr/hyprlock-colors.conf

$font = SF Pro Display

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = suave, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 4, suave
    animation = fadeOut, 1, 4, suave
    animation = inputFieldDots, 1, 2, suave
}

# ── Fundo (um bloco por monitor) ──────────────────────
background {
    monitor = HDMI-A-2
    path = ~/Pictures/Wallpapers/primary.png
    blur_passes = 2
    blur_size = 4
    brightness = $bg_brightness
    contrast = $bg_contrast
    vibrancy = 0.1
    noise = 0.02
}

background {
    monitor = HDMI-A-1
    path = ~/Pictures/Wallpapers/secondary.png
    blur_passes = 2
    blur_size = 4
    brightness = $bg_brightness
    contrast = $bg_contrast
    vibrancy = 0.1
    noise = 0.02
}

# ── Relógio ───────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $fg
    font_size = 110
    font_family = $font
    position = 0, 180
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $shadow
}

# ── Data ──────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] LC_TIME=en_US.UTF-8 date +"%A, %B %-d"
    color = $fg_dim
    font_size = 20
    font_family = $font
    position = 0, 80
    halign = center
    valign = center
}

# ── Campo de senha ────────────────────────────────────
input-field {
    monitor =
    size = 320, 56
    rounding = -1
    outline_thickness = 2
    outer_color = $outline
    inner_color = $pill
    font_color = $fg
    font_family = $font
    check_color = $ok
    fail_color = $fail
    capslock_color = $warn
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="$placeholder">Password</span>
    fail_text = <i>$FAIL</i> ($ATTEMPTS)
    position = 0, -80
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $shadow
}

# ── Usuário (rodapé) ──────────────────────────────────
label {
    monitor =
    text =   $USER
    color = $fg_dim
    font_size = 13
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
}

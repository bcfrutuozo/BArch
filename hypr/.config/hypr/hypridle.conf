general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' && ~/.config/hypr/scripts/hdr-kick.sh && sleep 1 && hyprctl reload
}

# 5 min: trava a sessão
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5:30 min: apaga a tela
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' && ~/.config/hypr/scripts/hdr-kick.sh
}

# 30 min: suspend
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}

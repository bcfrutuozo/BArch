general {
    # Quickshell lock (quickshell/lock), a resident process: lock.sh tells it to lock over IPC,
    # starts it if it is not running and restarts it if it dies
    lock_cmd = ~/.config/hypr/scripts/lock.sh
    # the AW (HDMI-A-2) is turned off before the suspend and on again only after the resume,
    # once the GPU and the side monitor are back: restoring its HDMI 2.1 link at resume left
    # it black (2026-11-02), a fresh connect does not (hdr-kick.sh sleep|resume)
    before_sleep_cmd = loginctl lock-session; ~/.config/hypr/scripts/hdr-kick.sh sleep
    # give nvidia-drm a few seconds after resume before the first modeset, and no reload:
    # extra modesets on a GPU that came back badly hung the machine (2026-10-28)
    after_sleep_cmd = sleep 3 && hyprctl dispatch 'hl.dsp.dpms({action = "on"})' && ~/.config/hypr/scripts/hdr-kick.sh resume
}

# 5 min: trava a sessão
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5:30 min: apaga a tela
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' && ~/.config/hypr/scripts/hdr-kick.sh
}

# 30 min: suspend
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}

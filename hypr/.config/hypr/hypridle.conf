general {
    # Quickshell lock (quickshell/lock); lock.sh restarts it if it dies, -n keeps it to one instance
    lock_cmd = ~/.config/hypr/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session
    # give nvidia-drm a few seconds after resume before the first modeset, and no reload:
    # extra modesets on a GPU that came back badly hung the machine (2026-10-28)
    after_sleep_cmd = sleep 3 && hyprctl dispatch 'hl.dsp.dpms({action = "on"})' && ~/.config/hypr/scripts/hdr-kick.sh
}

# 5 min: trava a sessão
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5:30 min: apaga a tela
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' && ~/.config/hypr/scripts/hdr-kick.sh
}

# 30 min: suspend
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}

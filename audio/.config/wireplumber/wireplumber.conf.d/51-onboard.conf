# ~/.config/wireplumber/wireplumber.conf.d/51-onboard.conf
# Realtek ALC1220 (HD-Audio Generic) — saída analógica em 32-bit / 192 kHz.
# O match pega só a saída analógica PCI; o HDMI da NVIDIA (hdmi-stereo)
# e o microfone USB ficam de fora.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.pci-.*analog-stereo.*" } ]
    actions = {
      update-props = {
        audio.format     = "S32LE"
        audio.rate       = 192000
        priority.session = 2000
        priority.driver  = 2000
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_output.pci-.*hdmi.*" } ]
    actions = {
      update-props = {
        priority.session = 500
        priority.driver  = 500
      }
    }
  }
]

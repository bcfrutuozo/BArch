# ~/.config/wireplumber/wireplumber.conf.d/51-bluez.conf — Bluetooth audio (AirPods and the like).
# Output only, at the best codec: AAC first, then SBC-XQ, then plain SBC. The headset's microphone
# is never used (the fifine is the microphone), so the headset profile (HFP/HSP, 16 kHz mono) is
# left out of the roles and the automatic switch to it, which fires whenever an app opens a
# capture stream (Discord, a call in the browser), is off. To use a headset's mic again, add
# hfp_hf and hsp_hs to bluez5.roles and set bluez5.autoswitch-profile = true.
monitor.bluez.properties = {
  bluez5.codecs             = [ aac sbc_xq sbc ]
  bluez5.enable-sbc-xq      = true
  bluez5.roles              = [ a2dp_sink a2dp_source ]
  bluez5.autoswitch-profile = false
}

monitor.bluez.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink ]
        bluez5.hw-volume    = [ a2dp_sink ]
      }
    }
  }
  {
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = {
      update-props = {
        priority.session = 3000
        priority.driver  = 3000
      }
    }
  }
]

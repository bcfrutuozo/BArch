# Nextcloud keeps its account password in the GNOME keyring. With autologin the keyring is only
# unlocked when the lock screen gets the password (pam_gnome_keyring in /etc/pam.d/barch-lock),
# and the autostart (~/.config/autostart/Nextcloud.desktop, written by Nextcloud itself) runs
# before that, so every login ended with an "Unlock Keyring" dialog. Wait for the unlock first.
# The unit is generated by systemd-xdg-autostart-generator; this drop-in extends it.
[Service]
ExecStartPre=%h/.local/bin/keyring-wait
TimeoutStartSec=65min

# systemd-oomd watches the apps (docs/machine.md "Memory"): when everything under app.slice spends
# more than 30 % of its time stalled on memory (PSI "full") for 20 s, with reclaim going on, it kills
# the one descendant with the most reclaim activity. Apps get their own scope through `uwsm app`
# (binds.lua, the launcher, barch); services under app.slice are "avoid" (service.d/50-oomd.conf),
# so an app goes first. Hyprland, PipeWire and the lock live in session.slice, which is never
# watched. 30 % (Fedora uses 50 %): a real stall, acted on before the desktop freezes; the zram
# thrash of the 2026-11-25 test stayed near 15 %, so normal swapping does not reach it.
# Never `systemctl --user revert app.slice`: it deletes this file.
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=30%
ManagedOOMMemoryPressureDurationSec=20s

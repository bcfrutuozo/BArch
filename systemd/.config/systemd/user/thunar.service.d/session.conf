# Thunar --daemon is D-Bus activated and knows nothing about the session, so it outlived
# Hyprland at poweroff and exited 1 on the broken Wayland socket (reported as a failure).
# Tie it to the graphical session: stopped (cleanly, SIGTERM) before the compositor goes.
[Unit]
PartOf=graphical-session.target
After=graphical-session.target

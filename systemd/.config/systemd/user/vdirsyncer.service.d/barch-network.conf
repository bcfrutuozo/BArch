# Skip the run quietly when iCloud cannot be resolved (link down, VPN or kill switch changing):
# the timer fires again in 15 min. A failing ExecCondition ends the unit as inactive, not failed,
# so barch failure stays silent; a real sync error still fails the unit and gets reported.
[Service]
ExecCondition=/bin/sh -c 'getent ahosts caldav.icloud.com >/dev/null'

# The packaged unit restarts on failure every 100 ms; a sync takes longer than
# StartLimitIntervalSec (10 s), so the start limit never trips and an iCloud outage
# (503) turns into a restart loop that hammers Apple until it answers 401
# (2026-11-10: 19 restarts in two minutes). The timer already retries every 15 min.
[Service]
Restart=no

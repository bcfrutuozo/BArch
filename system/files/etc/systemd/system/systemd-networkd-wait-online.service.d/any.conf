# BArch: network-online.target (the NAS mounts, Docker) waits for any one link to be routable, the
# cable or the Wi-Fi, not for every port: the board's second Ethernet port has no cable. The links
# keep RequiredForOnline=yes (with "no" wait-online would have nothing to wait for and time out).
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --operational-state=routable --timeout=30

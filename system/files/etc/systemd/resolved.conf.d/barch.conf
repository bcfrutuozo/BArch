# BArch: systemd-resolved, /etc/resolv.conf -> /run/systemd/resolve/stub-resolv.conf.
# The DNS servers come from DHCP per link (the pfSense) and, while the VPN is up, from the tunnel
# alone (barch-net: the tunnel takes "~." and the LAN links lose their DNS role).
[Resolve]
# no silent fallback to Cloudflare/Google/Quad9 when no link has a server: a lookup fails instead
FallbackDNS=
# names are never asked to the local network by broadcast (the firewall drops the answers anyway)
LLMNR=no
MulticastDNS=no

# BArch: iwd only joins Wi-Fi networks; addresses, routes and DNS are systemd-networkd's
# (/etc/systemd/network/25-wireless.network) and systemd-resolved's.
[General]
EnableNetworkConfiguration=false

# keep the kernel's interface (wlp4s0, the udev name) instead of iwd's own wlan0
[DriverQuirks]
DefaultInterface=*

[Network]
NameResolvingService=systemd
